name: Import Swiftgram baseline
on:
  push:
    branches: [upgrade/swiftgram-13-1-1]
    paths: [.github/workflows/import-swiftgram.yml]
permissions:
  contents: write
jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import pinned upstream source into isolated branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Swiftgram/Telegram-iOS.git
          git fetch --no-tags upstream master
          test "$(git rev-parse FETCH_HEAD)" = "9b35b732e4527e40f0adbb03f4aa22785ddfa74c"
          git read-tree --reset -u FETCH_HEAD
          git restore --source=HEAD --staged --worktree -- .github
          git commit -m "Update Swiftgram baseline to 13.1.1"
          git push origin HEAD:upgrade/swiftgram-13-1-1
